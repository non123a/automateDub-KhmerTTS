name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact: AutomateDub-Studio-windows
          - os: macos-latest
            platform: macos
            artifact: AutomateDub-Studio-macos
          - os: ubuntu-latest
            platform: linux
            artifact: AutomateDub-Studio-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install Windows FFmpeg build runtime
        if: matrix.platform == 'windows'
        run: choco install ffmpeg -y --no-progress
      - name: Install macOS FFmpeg build runtime
        if: matrix.platform == 'macos'
        run: brew install ffmpeg
      - name: Install Whisper.cpp build tools
        if: matrix.platform == 'linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          cmake build-essential ffmpeg patchelf libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0
      - name: Build bundled Whisper.cpp runtime
        run: uv run python packaging/prepare_whisper_runtime.py --platform ${{ matrix.platform }}
      - name: Stage bundled FFmpeg runtime
        run: uv run python packaging/prepare_ffmpeg_runtime.py --platform ${{ matrix.platform }}
      - name: Validate staged Windows FFmpeg binaries
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $runtime = "automatedub_studio/resources/runtime/bin/windows"
          foreach ($name in @("ffmpeg.exe", "ffprobe.exe")) {
            $path = Join-Path $runtime $name
            if (-not (Test-Path $path)) { throw "Missing staged $name" }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 2 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Staged $name is not a native Windows PE executable"
            }
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            if ($text -match "chocolatey|\.\.\\lib\\ffmpeg") {
              throw "Staged $name contains a Chocolatey launcher reference"
            }
            & $path -version
            if ($LASTEXITCODE -ne 0) { throw "Staged $name cannot execute" }
          }
      - name: Record bundled FFmpeg license
        run: >-
          ffmpeg -L > automatedub_studio/resources/runtime/FFMPEG_LICENSE_${{ matrix.platform }}.txt
      - name: Verify bundled Whisper.cpp executable
        run: uv run python packaging/verify_whisper_runtime.py --platform ${{ matrix.platform }}
      - name: Build package
        run: uv run --with pyinstaller python packaging/build.py --platform ${{ matrix.platform }}
      - name: Verify packaged runtime files
        run: uv run --with pyinstaller python packaging/verify_packaged_runtime.py --platform ${{ matrix.platform }}
      - name: Verify Windows GUI subprocess policy
        if: matrix.platform == 'windows'
        run: uv run pytest -q tests/test_process.py
      - name: Build macOS DMG
        if: matrix.platform == 'macos'
        run: packaging/macos/create-dmg.sh
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/**

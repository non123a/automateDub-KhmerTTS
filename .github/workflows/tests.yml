name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install system media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1
      - name: Run tests
        run: uv run pytest
      - name: Run Ruff
        run: uv run ruff check
      - name: Check whitespace
        run: git diff --check

[project]
name = "automatedub"
version = "0.1.0"
description = "Vertical-slice AI localization harness for Khmer media."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "camb-sdk>=1.5.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
studio = [
    "PySide6>=6.7",
]

[project.scripts]
automatedub = "automatedub.cli:main"
automatedub-studio = "automatedub_studio.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["automatedub*", "automatedub_studio*"]
exclude = ["research*", "benchmarks*", "tests*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "PySide6>=6.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
